<app-container>
  <header>
    <section class="cabecalho-link">
      <img src="assets/logo.png" alt="Logo Indexa">
    </section>

    <section class="cabecalho-contato">
      <img src="assets/adicionar-contato.png" alt="Adicionar Contato">
      <h1>Adicionar contato</h1>
    </section>
  </header>

  <form [formGroup]="contatoForm" (ngSubmit)="salvarContato()">
    <label for="nome">Nome</label>
    <input type="text" id="nome" formControlName="nome" placeholder="Digite o nome do contato" />

    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" formControlName="telefone" placeholder="Digite o telefone do contato" />

    <label for="email">E-mail</label>
    <input type="email" id="email" formControlName="email" placeholder="Digite o e-mail do contato" />

    <app-separador></app-separador>

    <label for="aniversario">Aniversário</label>
    <input type="date" id="aniversario" formControlName="aniversario" placeholder="Data de nascimento" />

    <label for="redes">Redes sociais</label>
    <div class="input-container">
      <span class="span-http">http://</span>
      <input type="url" id="redes" formControlName="redes" placeholder="Adicione a URL da página" />
    </div>

    <label for="observacoes">Observações</label>
    <textarea id="observacoes" formControlName="observacoes" placeholder="Coloque observações nesse espaço. Exemplo: &quot;Instrutora da academia &quot;Nova Imagem&quot;, amiga da Júlia.&quot;"></textarea>

    <section class="botoes">
      <button class="botao-cancelar" type="button" (click)="cancelar()">Cancelar</button>
      <button [class]="contatoForm.valid ? 'botao-salvar' : 'botao-desabilitado'" type="submit" [disabled]="!contatoForm.valid">Salvar contato</button>
    </section>
  </form>
</app-container>
